<svg xmlns="http://www.w3.org/2000/svg"
width="1280"
height="360"
viewBox="0 0 1280 360"
role="img"
aria-label="Maha Ahmed Abu Syam — Frontend Developer">

  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#08111f">
    <animate attributeName="stop-color"
             values="#08111f;#0c1828;#08111f"
             dur="8s"
             repeatCount="indefinite"/>
  </stop>

  <stop offset="55%" stop-color="#142b45">
    <animate attributeName="stop-color"
             values="#142b45;#193853;#142b45"
             dur="8s"
             repeatCount="indefinite"/>
  </stop>

  <stop offset="100%" stop-color="#0b1726">
    <animate attributeName="stop-color"
             values="#0b1726;#102c2b;#0b1726"
             dur="8s"
             repeatCount="indefinite"/>
  </stop>
</linearGradient>

<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#2a8c82"/>
  <stop offset="50%" stop-color="#72e0d5"/>
  <stop offset="100%" stop-color="#2a8c82"/>
  <animate attributeName="x1"
           values="0;1;0"
           dur="5s"
           repeatCount="indefinite"/>
</linearGradient>

<radialGradient id="glow">
  <stop offset="0%" stop-color="#5fd0c5" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#5fd0c5" stop-opacity="0"/>
</radialGradient>

<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.045"
        stroke-width="1"/>
</pattern>

<filter id="blur">
  <feGaussianBlur stdDeviation="18"/>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="4"/>
</filter>

  </defs>  <!-- Background -->  <rect width="1280" height="360" fill="url(#bg)"/>  <!-- Animated grid -->  <rect width="1280" height="360" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="32 32"
      dur="8s"
      repeatCount="indefinite"/>
  </rect>  <!-- Ambient glow -->  <circle cx="1080" cy="100" r="230" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity"
             values="0.55;0.9;0.55"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>  <circle cx="170" cy="330" r="180" fill="url(#glow)" filter="url(#blur)" opacity="0.18"/>  <!-- Decorative orbit -->  <g fill="none" stroke="#5fd0c5"><circle cx="1090" cy="105" r="170"
        stroke-opacity="0.14"
        stroke-width="2">
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 1090 105"
    to="360 1090 105"
    dur="28s"
    repeatCount="indefinite"/>
</circle>

<circle cx="1090" cy="105" r="125"
        stroke-opacity="0.12"
        stroke-width="2">
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="360 1090 105"
    to="0 1090 105"
    dur="20s"
    repeatCount="indefinite"/>
</circle>

  </g>  <!-- Moving circuit lines --><g fill="none"
stroke="#5fd0c5"
stroke-opacity="0.25"
stroke-width="2">

<path d="M850 45 H980 V80 H1040">
  <animate attributeName="stroke-opacity"
           values="0.12;0.5;0.12"
           dur="3s"
           repeatCount="indefinite"/>
</path>

<path d="M930 180 H1010 V145 H1120">
  <animate attributeName="stroke-opacity"
           values="0.1;0.45;0.1"
           dur="4s"
           repeatCount="indefinite"/>
</path>

<path d="M1000 250 H1080 V220 H1190">
  <animate attributeName="stroke-opacity"
           values="0.08;0.4;0.08"
           dur="3.5s"
           repeatCount="indefinite"/>
</path>

  </g>  <!-- Moving nodes -->  <g fill="#72e0d5"><circle cx="850" cy="45" r="3">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="80" r="3">
  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="930" cy="180" r="3">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1120" cy="145" r="3">
  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="2.2s"
           repeatCount="indefinite"/>
</circle>

  </g>  <!-- Large code symbol --><text x="920"
y="290"
font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace"
font-size="190"
font-weight="700"
fill="#ffffff"
fill-opacity="0.045">

&lt;/&gt;

<animateTransform
  attributeName="transform"
  type="translate"
  values="0 0; 0 -8; 0 0"
  dur="5s"
  repeatCount="indefinite"/>

  </text>  <!-- Accent line -->  <rect x="78" y="76" width="86" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width"
             values="86;120;86"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>  <!-- Main title --><text x="78"
y="145"
font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
font-size="58"
font-weight="700"
fill="#ffffff">
Maha Ahmed Abu Syam
</text>

  <!-- Subtitle --><text x="80"
y="193"
font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
font-size="27"
font-weight="600"
fill="#72e0d5">
Frontend Developer · React · TypeScript
</text>

  <!-- Description --><text x="80"
y="229"
font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
font-size="18"
fill="#b8c8d8">
Building responsive, accessible web applications
</text>

  <!-- Animated typing cursor --><rect x="540"
y="212"
width="3"
height="22"
rx="1.5"
fill="#72e0d5">
<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>
</rect>

  <!-- Technology pills --><g font-family="'Segoe UI', Arial, sans-serif"
font-size="14"
font-weight="600"
fill="#eaf5f4"
text-anchor="middle">

<g>
  <rect x="80" y="265" width="70" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="115" y="286">React</text>
</g>

<g>
  <rect x="162" y="265" width="104" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="214" y="286">TypeScript</text>
</g>

<g>
  <rect x="278" y="265" width="124" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="340" y="286">Redux Toolkit</text>
</g>

<g>
  <rect x="414" y="265" width="84" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="456" y="286">Zustand</text>
</g>

<g>
  <rect x="510" y="265" width="108" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="564" y="286">Material UI</text>
</g>

<g>
  <rect x="630" y="265" width="90" height="32" rx="16"
        fill="#ffffff" fill-opacity="0.06"
        stroke="#5fd0c5" stroke-opacity="0.5"/>
  <text x="675" y="286">Tailwind</text>
</g>

  </g>  <!-- Bottom accent -->  <rect x="0" y="354" width="1280" height="6" fill="url(#accent)">
    <animate attributeName="opacity"
             values="0.5;1;0.5"
             dur="3s"
             repeatCount="indefinite"/>
  </rect></svg>
