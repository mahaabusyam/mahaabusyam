<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Visit my portfolio: mahaabusyam.github.io">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd0c5"/>
      <stop offset=".5" stop-color="#8b9bff"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0c5"/>
      <stop offset="1" stop-color="#8b9bff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
  </defs>
  <style>
    .run { animation: run 4s linear infinite; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: -100; } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .run, .arrow { animation: none; } }
  </style>

  <!-- الخلفية والإطار الثابت الخافت -->
  <rect x="3" y="3" width="894" height="104" rx="22" fill="url(#bg)"/>
  <rect x="3" y="3" width="894" height="104" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <!-- خط الضوء الدائر -->
  <rect class="run" x="3" y="3" width="894" height="104" rx="22" fill="none" stroke="url(#ac)" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="22 78"/>

  <!-- اللوغو -->
  <g transform="translate(30 17) scale(1.6)">
    <rect x="1" y="1" width="46" height="46" rx="13" fill="#0f1d33" stroke="#ffffff" stroke-opacity=".18"/>
    <g transform="translate(24 24) scale(.88) translate(-24 -24)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 11Q10 11 10 15V20Q10 24 6.5 24Q10 24 10 28V33Q10 37 14 37" stroke="#cfe9ff" stroke-width="3.4"/>
      <path d="M34 11Q38 11 38 15V20Q38 24 41.5 24Q38 24 38 28V33Q38 37 34 37" stroke="#cfe9ff" stroke-width="3.4"/>
      <path d="M14.5 14L24 27L33.5 14" stroke="url(#v)" stroke-width="4.4"/>
    </g>
  </g>

  <!-- النصوص -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="130" y="44" font-size="15" font-weight="700" letter-spacing="3" fill="#5fd0c5">MY PORTFOLIO</text>
    <text x="130" y="82" font-size="34" font-weight="800" letter-spacing="-.5" fill="#ffffff">mahaabusyam.github.io</text>
  </g>

  <!-- زر الزيارة -->
  <rect x="696" y="30" width="172" height="50" rx="25" fill="#5fd0c5" fill-opacity=".16" stroke="#5fd0c5" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="730" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#eafffd">Visit site</text>
  <path class="arrow" d="M820 55H838M831 48L838 55L831 62" fill="none" stroke="#5fd0c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
