<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" role="img" aria-label="Tradix">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc16b"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
    <filter id="bl2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="cp2"><rect width="640" height="232" rx="20"/></clipPath>
    <linearGradient id="sh2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-18deg); } 100% { transform: translateX(980px) skewX(-18deg); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: beat 2.2s ease-out infinite; }
    @keyframes beat { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .shine, .dot { animation: none; } }
  </style>

  <g clip-path="url(#cp2)">
    <rect width="640" height="232" fill="url(#bg2)"/>
    <circle cx="560" cy="30" r="110" fill="#ffc16b" fill-opacity="0.35" filter="url(#bl2)"/>
    <circle cx="80" cy="260" r="90" fill="#f08a3c" fill-opacity="0.22" filter="url(#bl2)"/>
    <rect width="640" height="5" fill="url(#ac2)"/>
    <rect class="shine" x="0" y="0" width="120" height="232" fill="url(#sh2)"/>
  </g>
  <rect x="1" y="1" width="638" height="230" rx="19" fill="none" stroke="#ffc16b" stroke-opacity="0.45" stroke-width="1.5"/>

  <rect x="32" y="34" width="58" height="58" rx="16" fill="url(#ac2)"/>
  <g transform="translate(61 63)"><path d="M-13 9L-4 -1L3 5L13 -9" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 -9H13V-2" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <text x="106" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Tradix</text>
  <text x="106" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffc16b" letter-spacing="1.4">FEATURED PROJECT</text>

  <text x="32" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d4dfea">Responsive trading dashboard with live</text>
  <text x="32" y="151" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d4dfea">prices, charts and transactions.</text>

  <rect x="32" y="168" width="70" height="30" rx="15" fill="#ffc16b" fill-opacity="0.14" stroke="#ffc16b" stroke-opacity="0.55"/><text x="67.0" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">React</text><rect x="110" y="168" width="136" height="30" rx="15" fill="#ffc16b" fill-opacity="0.14" stroke="#ffc16b" stroke-opacity="0.55"/><text x="178.0" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">Redux Toolkit</text><rect x="254" y="168" width="111" height="30" rx="15" fill="#ffc16b" fill-opacity="0.14" stroke="#ffc16b" stroke-opacity="0.55"/><text x="309.5" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">MUI Charts</text>

  <g>
