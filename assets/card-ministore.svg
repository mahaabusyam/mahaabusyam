<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" role="img" aria-label="Mini Store">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <linearGradient id="ac3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#e0527a"/>
    </linearGradient>
    <filter id="bl3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="cp3"><rect width="640" height="232" rx="20"/></clipPath>
    <linearGradient id="sh3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-260px) skewX(-18deg); } 100% { transform: translateX(980px) skewX(-18deg); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: beat 2.2s ease-out infinite; }
    @keyframes beat { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .shine, .dot { animation: none; } }
  </style>

  <g clip-path="url(#cp3)">
    <rect width="640" height="232" fill="url(#bg3)"/>
    <circle cx="560" cy="30" r="110" fill="#ff8fab" fill-opacity="0.35" filter="url(#bl3)"/>
    <circle cx="80" cy="260" r="90" fill="#e0527a" fill-opacity="0.22" filter="url(#bl3)"/>
    <rect width="640" height="5" fill="url(#ac3)"/>
    <rect class="shine" x="0" y="0" width="120" height="232" fill="url(#sh3)"/>
  </g>
  <rect x="1" y="1" width="638" height="230" rx="19" fill="none" stroke="#ff8fab" stroke-opacity="0.45" stroke-width="1.5"/>

  <rect x="32" y="34" width="58" height="58" rx="16" fill="url(#ac3)"/>
  <g transform="translate(61 63)"><path d="M-11 -6H11L9 12H-9Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 -6V-9A5 5 0 0 1 5 -9V-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>

  <text x="106" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Mini Store</text>
  <text x="106" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ff8fab" letter-spacing="1.4">FEATURED PROJECT</text>

  <text x="32" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d4dfea">E-commerce app with cart, wishlist</text>
  <text x="32" y="151" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d4dfea">and a validated checkout.</text>

  <rect x="32" y="168" width="94" height="30" rx="15" fill="#ff8fab" fill-opacity="0.14" stroke="#ff8fab" stroke-opacity="0.55"/><text x="79.0" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">React 19</text><rect x="134" y="168" width="136" height="30" rx="15" fill="#ff8fab" fill-opacity="0.14" stroke="#ff8fab" stroke-opacity="0.55"/><text x="202.0" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">Redux Toolkit</text><rect x="278" y="168" width="119" height="30" rx="15" fill="#ff8fab" fill-opacity="0.14" stroke="#ff8fab" stroke-opacity="0.55"/><text x="337.5" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eef4fa">Material UI</text>

  <g>
    <rect x="486" y="34" width="122" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ff8fab" stroke-opacity="0.5"/>
    <circle cx="506" cy="49" r="4.5" fill="#ff8fab"/>
    <circle class="dot" cx="506" cy="49" r="4.5" fill="#ff8fab"/>
    <text x="518" y="54" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#eef4fa">Live demo</text>
  </g>
</svg>
